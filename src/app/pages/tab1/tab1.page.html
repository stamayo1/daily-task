<app-header></app-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--background: #f8f9fa;">
  <div class="header-section">
    <h1 class="main-title">Tareas de Hoy</h1>
    <p class="subtitle date-text">{{ todayDate | formattedDate }}</p>
    <p class="subtitle">
      Tienes {{ filteredTasks().length }} tareas en esta lista.
    </p>
  </div>

  <!-- Status Filters -->
  <div class="filter-row status-filters">
    <ion-chip [class.selected]="statusFilter() === 'all'" (click)="setStatusFilter('all')">
      <ion-label>Todas</ion-label>
    </ion-chip>
    <ion-chip [class.selected]="statusFilter() === 'today'" (click)="setStatusFilter('today')">
      <ion-label>Hoy</ion-label>
    </ion-chip>
    <ion-chip [class.selected]="statusFilter() === 'pending'" (click)="setStatusFilter('pending')">
      <ion-label>Pendientes<span *ngIf="pendingCount() > 0"> {{ pendingCount() }}</span></ion-label>
    </ion-chip>
    <ion-chip [class.selected]="statusFilter() === 'completed'" (click)="setStatusFilter('completed')">
      <ion-label>Completadas</ion-label>
    </ion-chip>
  </div>

  <!-- Category Filters -->
  <div class="filter-row category-filters" *ngIf="remoteConfigService.showCategoryClassification() && categoryFacade.categories().length > 0">
    <ion-chip *ngFor="let cat of categoryFacade.categories()" 
              [class.selected]="categoryFilter() === cat.id"
              (click)="toggleCategoryFilter(cat.id)">
      <ion-label>{{ cat.name }}</ion-label>
    </ion-chip>
  </div>

  <!-- Task List -->
  <div class="tasks-container">
    <app-task-card *ngFor="let task of filteredTasks()"
                   [task]="task"
                   [categoryName]="remoteConfigService.showCategoryClassification() ? getCategoryName(task.category_id) : undefined"
                   (completeTask)="onCompleteTask($event)"
                   (optionsClicked)="goToDetail($event)"
                   (click)="goToDetail(task)">
    </app-task-card>
    
    <div class="empty-state" *ngIf="filteredTasks().length === 0">
      <p>No hay tareas que coincidan con los filtros seleccionados.</p>
    </div>
  </div>
</ion-content>
