<app-header></app-header>

<ion-content [scrollY]="true">
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Crear nueva tarea</h1>
      <p class="page-subtitle">Divide tus metas en pasos accionables.</p>
    </div>

    <app-task-form datetimeId="datetime-create" (submitted)="onSubmit($event)">
      <!-- Botón submit proyectado en ng-content -->
      <div class="submit-section">
        <ion-button expand="block" type="submit" class="submit-btn">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Crear Tarea
        </ion-button>
      </div>
    </app-task-form>

  </div>
</ion-content>
